name: pulid-candidates

# Build ISOLATED candidate images for A/B testing (Alara identity lock research).
# Does NOT touch upstream release/dev pipeline.
# Trigger: manual (workflow_dispatch) OR push a v* tag.
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Image tag (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      candidates:
        description: "Which candidates to build (comma-separated: a,b or a or b)"
        required: false
        default: "a,b"
  push:
    tags:
      - "pulid-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        candidate:
          - id: a
            dockerfile: Dockerfile.pulid.a
            name: lldacing
          - id: b
            dockerfile: Dockerfile.pulid.b
            name: balazik

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Skip if candidate not selected
        id: gate
        run: |
          SEL="${{ github.event.inputs.candidates || 'a,b' }}"
          if echo ",$SEL," | grep -q ",${{ matrix.candidate.id }},"; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/pulid-v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push candidate ${{ matrix.candidate.id }} (${{ matrix.candidate.name }})
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.candidate.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPO }}/ugc-pulid-candidate-${{ matrix.candidate.id }}:${{ steps.ver.outputs.version }}
            ${{ vars.DOCKERHUB_REPO }}/ugc-pulid-candidate-${{ matrix.candidate.id }}:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_REPO }}/ugc-pulid-candidate-${{ matrix.candidate.id }}:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_REPO }}/ugc-pulid-candidate-${{ matrix.candidate.id }}:buildcache,mode=max

      - name: Summary
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "## Candidate ${{ matrix.candidate.id }} (${{ matrix.candidate.name }}) built" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ vars.DOCKERHUB_REPO }}/ugc-pulid-candidate-${{ matrix.candidate.id }}:${{ steps.ver.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile: \`${{ matrix.candidate.dockerfile }}\`" >> $GITHUB_STEP_SUMMARY
